<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Meine Modellbahn-Sammlung</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sammlung" />
<meta name="theme-color" content="#12161D" />
<style>
  html, body { margin: 0; padding: 0; background: #12161D; color: #EDE7DA; font-family: -apple-system, sans-serif; }
  #root { min-height: 100vh; }
  #fallback { padding: 24px; line-height: 1.6; }
  #fallback h1 { font-size: 18px; }
</style>
</head>
<body>
<div id="root">
  <div id="fallback">
    <h1>Wird geladen…</h1>
    <p>Falls diese Meldung stehen bleibt: Bitte über eine echte https://-Adresse öffnen (z. B. GitHub Pages), nicht als lokale Datei.</p>
  </div>
</div>
<script>
  window.addEventListener("error", function (e) {
    var fb = document.getElementById("fallback");
    if (fb) {
      fb.innerHTML = "<h1>Es gab ein Problem beim Laden</h1><p style='opacity:0.6;font-size:12px'>" + (e.message || "") + "</p>";
    }
  });
</script>
